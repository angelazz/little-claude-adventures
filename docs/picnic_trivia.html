<style>
  :root{
    --bg:#241d2b; --bg2:#2f2636; --bg3:#3a2f42; --line:#473a50;
    --ink:#f4ead9; --mute:#bba79b;
    --gold:#e7a93e; --gold-soft:#f0c572;
    --fig:#c06f81; --fig-dim:rgba(192,111,129,.16);
    --olive:#aeba6f; --olive-dim:rgba(174,186,111,.15);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'Space Mono',ui-monospace,Menlo,monospace;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #3a2740 0%, rgba(58,39,64,0) 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans); line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:0 16px 64px;
  }
  .wrap{max-width:540px;margin:0 auto}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  a{color:var(--gold-soft)}
  button{font-family:inherit}

  header{padding:30px 4px 14px;text-align:center}
  .sun{display:block;margin:0 auto 14px}
  .eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.04;margin:8px 0 6px;letter-spacing:-.01em}
  .lede{color:var(--mute);font-size:15px;margin:0 auto;max-width:30em}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:20px 0 8px}
  .tally{font-family:var(--mono);font-size:12px;color:var(--mute);text-align:center;margin:2px 0 0}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6b5a52;margin-right:5px;vertical-align:1px}
  .dot.live{background:var(--olive)}

  .gate{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;margin:18px 0;text-align:center}
  .gate h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 4px}
  .gate p{color:var(--mute);font-size:14px;margin:0 0 14px}
  .field{display:flex;gap:8px}
  input[type=text]{
    flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:inherit;font-size:16px;padding:11px 13px;min-width:0;
  }
  input[type=text]::placeholder{color:#8c7d86}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,169,62,.18)}
  .btn{background:var(--gold);color:#2a1c08;border:none;border-radius:10px;font-weight:600;font-size:15px;padding:11px 16px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:9px 13px;font-size:14px}

  .me-bar{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mute);margin:2px 0 0}
  .me-bar b{color:var(--ink);font-weight:600}
  .me-bar button{background:none;border:none;color:var(--gold-soft);font-size:13px;cursor:pointer;padding:2px;text-decoration:underline}

  .banner{border-radius:10px;padding:11px 13px;font-size:13px;margin:14px 0;text-align:center}
  .banner.warn{background:var(--fig-dim);border:1px solid rgba(192,111,129,.4);color:#f0c2cc}
  .banner.warn b{color:#fff}

  .section-head{display:flex;align-items:baseline;gap:10px;margin:30px 2px 6px}
  .section-head .k{font-family:var(--serif);font-weight:500;font-size:22px}
  .section-head .sub{font-size:13px;color:var(--mute)}
  .seg{height:1px;background:var(--line);margin-bottom:14px}

  .q{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin:0 0 12px;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .q-top{display:flex;gap:12px;align-items:flex-start}
  .num{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--gold);line-height:1;min-width:30px}
  .q-body{flex:1;min-width:0}
  .chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:7px}
  .chip.win{background:var(--fig-dim);color:#e7a3b1}
  .chip.pts{background:var(--olive-dim);color:#cdd79b}
  .q-text{font-size:16.5px;line-height:1.35;margin:0}
  .prize{font-size:13px;color:var(--mute);margin:6px 0 0}
  .prize b{color:var(--fig);font-weight:600}

  .guess-row{display:flex;gap:8px;margin:12px 0 0}
  .guess-row input{font-size:16px;padding:10px 12px}
  .add{background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;padding:0 14px;cursor:pointer}
  .add:active{transform:scale(.97)}

  .guesses{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0}
  .tk{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:13px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .tk .who{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.03em}
  .tk .val{color:var(--ink)}
  .tk.win-tk{border-color:var(--gold);background:rgba(231,169,62,.14)}
  .tk.win-tk .val{color:var(--gold-soft)}
  .tk.wrong-tk{border-color:var(--fig);background:var(--fig-dim)}
  .tk.wrong-tk .val{color:#e7a3b1}
  .empty{font-size:13px;color:#8c7d86;font-style:italic;margin:11px 0 0}

  .answer{margin:12px 0 0;padding:11px 12px;background:rgba(231,169,62,.1);border:1px solid rgba(231,169,62,.35);border-radius:10px;font-size:14px}
  .answer .lab{color:var(--gold);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
  .answer .win-line{color:var(--mute);font-size:13px;margin-top:5px}
  .answer .win-line b{color:var(--ink)}

  .champ{background:linear-gradient(180deg,rgba(231,169,62,.16),rgba(231,169,62,.05));border:1px solid rgba(231,169,62,.45);border-radius:var(--r);padding:18px;margin:18px 0;text-align:center}
  .champ .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .champ .name{font-family:var(--serif);font-size:30px;font-weight:500;margin:4px 0 2px}
  .champ .pts{color:var(--mute);font-size:14px}
  .board-list{list-style:none;padding:0;margin:12px 0 0;font-size:14px}
  .board-list li{display:flex;justify-content:space-between;padding:5px 4px;border-top:1px solid var(--line)}
  .board-list .p{font-family:var(--mono);color:var(--gold-soft)}

  .lb{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:28px 0 8px}
  .lb-head{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 12px}
  .lb-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--line);font-size:14px}
  .lb-rank{font-family:var(--mono);font-size:12px;color:var(--mute);min-width:18px}
  .lb-name{flex:1}
  .lb-pts{font-family:var(--mono);font-size:13px;color:var(--gold-soft)}
  .lb-row.me-row .lb-name{color:var(--gold);font-weight:600}

  details.host{margin:34px 0 8px;border-top:1px solid var(--line);padding-top:14px}
  details.host>summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none;text-align:center}
  details.host>summary::-webkit-details-marker{display:none}
  .host-panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
  .host-panel h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 4px}
  .host-panel .hint{color:var(--mute);font-size:13px;margin:0 0 12px}
  .host-row{margin:0 0 11px}
  .host-row label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
  .host-row label b{color:var(--ink);font-weight:500}
  .host-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .reveal-on{background:var(--fig);color:#2a0d12}
  .danger{background:none;border:1px solid var(--line);color:#c98a96}

  footer{text-align:center;color:#8c7d86;font-size:12.5px;margin-top:30px;font-style:italic}
  @media (prefers-reduced-motion: reduce){ .q,.tk{animation:none;opacity:1;transform:none} }
</style>

<div class="wrap" id="app">
  <h2 class="sr-only">Guess the Spread — an asynchronous trivia board that syncs across phones.</h2>

  <header>
    <svg class="sun" width="64" height="40" viewBox="0 0 64 40" aria-hidden="true">
      <defs><clipPath id="hz"><rect x="0" y="0" width="64" height="30"/></clipPath></defs>
      <g clip-path="url(#hz)">
        <circle cx="32" cy="30" r="15" fill="#e7a93e"/>
        <circle cx="32" cy="30" r="22" fill="none" stroke="#e7a93e" stroke-opacity=".35" stroke-width="1.5"/>
      </g>
      <line x1="6" y1="30" x2="58" y2="30" stroke="#e7a93e" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <!-- <div class="eyebrow">Halo turns 25 · rooftop at golden hour</div> -->
    <h1>Guess&nbsp;the&nbsp;Spread</h1>
    <p class="lede">Bonuses for early correct answers. Penalties for incorrect answers. Reward after dessert.</p>
    <div class="rule"></div>
    <p class="tally" id="tally"></p>
  </header>

  <div id="setup-slot"></div>
  <div id="champ-slot"></div>
  <div id="gate-slot"></div>
  <div id="board-slot"></div>
  <div id="leaderboard-slot"></div>

  <details class="host" id="host"><summary>Host controls</summary><div id="host-slot"></div></details>
  <!-- <footer>Made for the table. Pour a drink, take a guess.</footer> -->
</div>

<script>
/* ---------- questions ---------- */
var QS = [
  {id:"q1", sec:"pts", n:1, kind:"number", q:"How many months was the cheddar aged?", prize:"the wedge", suffix:"months", src:"host"},
  {id:"q2", sec:"pts", n:2, kind:"text", q:"What is the capital of Oregon", accept:["salem", "Salem"], ans:"Salem"},
  {id:"q3", sec:"pts", n:3, kind:"text",   q:"The tinned fish — what species, and from what country?", accept:["salem", "Salem"], ans:"Salem"},
  {id:"q4", sec:"pts", n:4, kind:"text",   q:"My go to Wordle Starter in all caps: xxOxE", accept:["SMOTE", "smote"], ans:"SMOTE"},
  {id:"q5", sec:"pts", n:5, kind:"text",   q:"My longest NYT Spelling Bee word in all caps using: TINAHOL", accept:["ANNIHILATION", "annihilation"], ans:"Annihilation"},
  {id:"q6", sec:"pts", n:6, kind:"number",   q:"How many sardines were in that jar", accept:["25","twenty-five","twenty five"], ans:"25"},

  // {id:"q7",  sec:"pts", n:7,  kind:"text", q:"Burrata is mozzarella wrapped around curds and what?", accept:["cream","fresh cream"], ans:"Cream"},
  // {id:"q10", sec:"pts", n:10, kind:"text", q:"True or false: honey never spoils.", accept:["true","t","yes"], ans:"True"},
  // {id:"q11", sec:"pts", n:11, kind:"text", q:"Bone marrow is traditionally roasted in the bone and spread on what?", accept:["toast","bread","toasted bread"], ans:"Toast"},
  // {id:"q12", sec:"pts", n:12, kind:"number", q:"How many different cheeses are on the board tonight?", src:"host"},
  // {id:"q13", sec:"pts", n:13, kind:"text", q:"Which guest traveled the farthest to be here tonight?", src:"host"},
  // {id:"q14", sec:"pts", n:14, kind:"text", q:"How old is Halo today?", accept:["25","twenty-five","twenty five"], ans:"25"}
];

/* ---------- state ---------- */
var me="", board={}, state={revealed:false, answers:{}};
var db=null, connected=false;
var configured = firebaseConfig.apiKey.indexOf("PASTE")===-1;

function norm(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," "); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function initials(name){ var p=String(name).trim().split(/\s+/); return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase(); }
function sanitizeKey(s){ return String(s).replace(/[.#$\[\]\/]/g,"_"); }
function listFor(id){
  var raw=board[id]; if(!raw) return [];
  return Object.keys(raw).map(function(k){ var g=raw[k]; return {id:k,name:g.name,value:g.value,ts:g.ts||0}; })
         .sort(function(a,b){ return a.ts-b.ts; });
}

/* ---------- firebase ---------- */
function initFirebase(){
  if(!configured) return;
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    db.ref("board").on("value",function(s){ board=s.val()||{}; render(); });
    db.ref("state").on("value",function(s){ var v=s.val()||{}; state={revealed:!!v.revealed, answers:v.answers||{}}; render(); });
    db.ref(".info/connected").on("value",function(s){ connected=!!s.val(); render(); });
  }catch(e){ console.error(e); }
}
function addGuess(qId, raw){
  var v=String(raw||"").trim(); if(!v||!db) return;
  db.ref("board/"+qId+"/"+sanitizeKey(me)).set({name:me, value:v, ts:Date.now()});
}

/* ---------- scoring ---------- */
function answerFor(q){ if(q.src==="host") return state.answers[q.id]!=null?state.answers[q.id]:null; return q.ans!=null?q.ans:null; }
function isCorrect(q,val){
  if(q.judged) return false;
  var a=answerFor(q); if(a==null) return false;
  if(q.kind==="number") return false;
  if(q.accept) return q.accept.indexOf(norm(val))>-1;
  return norm(val)===norm(a);
}
function closestWinnerId(q){
  var a=answerFor(q); if(a==null) return null;
  var t=parseFloat(a); if(isNaN(t)) return null;
  var gs=listFor(q.id).map(function(g){return {id:g.id,num:parseFloat(g.value)};}).filter(function(g){return !isNaN(g.num);});
  if(!gs.length) return null;
  gs.sort(function(x,y){return Math.abs(x.num-t)-Math.abs(y.num-t);});
  return gs[0].id;
}
function winnerNameFor(q){
  if(q.kind==="number"){ var w=closestWinnerId(q); if(!w) return null; var a=listFor(q.id); for(var i=0;i<a.length;i++) if(a[i].id===w) return a[i].name; return null; }
  var arr=listFor(q.id); for(var j=0;j<arr.length;j++) if(isCorrect(q,arr[j].value)) return arr[j].name; return null;
}
function leaderboard(){
  var pts={};
  QS.forEach(function(q){
    var gs=listFor(q.id), a=answerFor(q);
    gs.forEach(function(g){ if(!(g.name in pts)) pts[g.name]=0; });
    if(q.kind==="number"){
      var w=closestWinnerId(q);
      if(w) gs.forEach(function(g){ if(g.id===w) pts[g.name]+=3; });
    } else {
      var correctCount=0;
      gs.forEach(function(g){
        if(isCorrect(q,g.value)){ pts[g.name]+=(correctCount===0?4:correctCount===1?3:2); correctCount++; }
        else if(a!=null&&!q.judged) pts[g.name]-=1;
      });
    }
  });
  return Object.keys(pts).map(function(k){return {name:k,p:pts[k]};}).sort(function(x,y){return y.p-x.p;});
}

/* ---------- render ---------- */
function render(){
  var total=0; QS.forEach(function(q){ total+=listFor(q.id).length; });
  document.getElementById("tally").innerHTML=
    '<span class="dot'+(connected?' live':'')+'"></span>'+total+(total===1?" guess":" guesses")+" so far";
  renderSetup(); renderGate(); renderChamp(); renderBoard(); renderLeaderboard(); renderHost();
}
function renderSetup(){
  var slot=document.getElementById("setup-slot");
  slot.innerHTML = configured ? "" :
    '<div class="banner warn"><b>Setup needed.</b> Paste your Firebase config near the top of this file (see the comment), then re-upload. Until then, guesses won\u2019t save or sync.</div>';
}
function renderGate(){
  var slot=document.getElementById("gate-slot");
  if(me){ slot.innerHTML='<div class="me-bar">playing as <b>'+esc(me)+'</b></div>'; return; }
  slot.innerHTML='<div class="gate"><h2>name?</h2>'+
    '<div class="field"><input id="name-in" type="text" placeholder="e.g. Ayana" maxlength="24" autocomplete="off" /><button class="btn" id="name-go">Start</button></div>'+
    '<div id="name-err" style="color:#f0c2cc;font-size:13px;margin-top:8px;min-height:18px"></div></div>';
  var input=document.getElementById("name-in"), go=document.getElementById("name-go");
  function start(){
    var v=input.value.trim(); if(!v) return;
    me=v; render();
  }
  go.onclick=start; input.addEventListener("keydown",function(e){ if(e.key==="Enter") start(); }); input.focus();
}
function sectionBlock(sec,title,sub){
  var html='<div class="section-head"><span class="k">'+title+'</span><span class="sub">'+sub+'</span></div><div class="seg"></div>';
  QS.filter(function(q){return q.sec===sec;}).forEach(function(q,i){ html+=card(q,i); }); return html;
}
function card(q,i){
  var gs=listFor(q.id), revealed=state.revealed;
  var winId=revealed&&q.kind==="number"?closestWinnerId(q):null;
  var chip='';
  var ansKnown=revealed&&answerFor(q)!=null&&!q.judged;
  var gHtml = gs.length
    ? '<div class="guesses">'+gs.map(function(g){
        var win=revealed&&(winId?g.id===winId:isCorrect(q,g.value));
        var wrong=ansKnown&&q.kind!=="number"&&!isCorrect(q,g.value);
        var isMe=g.name===me, showVal=revealed||isMe;
        return '<span class="tk'+(win?' win-tk':wrong?' wrong-tk':'')+'"><span class="who">'+esc(initials(g.name))+'</span><span class="val">'+(showVal?esc(g.value):'••••')+'</span></span>';
      }).join("")+'</div>'
    : '<p class="empty">no guesses yet \u2014 be the first</p>';
  var ansHtml="";
  if(revealed){
    var a=answerFor(q);
    var shown=a!=null?esc(a)+(q.suffix?(" "+q.suffix):""):(q.judged?"host decides \u2014 see the table":"\u2014");
    var wn=winnerNameFor(q);
    var winLine=q.judged?'<div class="win-line">winner picked by the host</div>'
      :(wn?'<div class="win-line">point to <b>'+esc(wn)+'</b></div>':'<div class="win-line">no one nailed it</div>');
    ansHtml='<div class="answer"><span class="lab">answer</span>'+shown+winLine+'</div>';
  }
  var myGuess=gs.filter(function(g){return g.name===me;})[0]||null;
  var inHtml=revealed?"":myGuess
    ? '<p class="empty" style="margin:10px 0 0">your answer: <b style="color:var(--ink)">'+esc(myGuess.value)+'</b></p>'
    : '<div class="guess-row"><input type="text" '+(q.kind==="number"?'inputmode="numeric" ':'')+
      'placeholder="'+(q.kind==="number"?"your number":"your guess")+'" maxlength="40" autocomplete="off" data-q="'+q.id+'" />'+
      '<button class="add" data-add="'+q.id+'">Lock in</button></div>';
  return '<div class="q" style="animation-delay:'+(i*55)+'ms"><div class="q-top"><div class="num">'+q.n+'</div>'+
    '<div class="q-body">'+chip+'<p class="q-text">'+esc(q.q)+'</p>'+inHtml+gHtml+ansHtml+'</div></div></div>';
}
function renderBoard(){
  var slot=document.getElementById("board-slot");
  if(!me){ slot.innerHTML=""; return; }
  slot.innerHTML=sectionBlock("pts","Questions","first correct earns +4 · wrong answers cost −1");
  slot.querySelectorAll("[data-add]").forEach(function(btn){
    var id=btn.getAttribute("data-add"), inp=slot.querySelector('input[data-q="'+id+'"]');
    function go(){ var v=inp.value; inp.value=""; addGuess(id,v); }
    btn.onclick=go; inp.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
  });
}
function renderChamp(){
  var slot=document.getElementById("champ-slot");
  if(!state.revealed){ slot.innerHTML=""; return; }
  var lb=leaderboard(); if(!lb.length){ slot.innerHTML=""; return; }
  var top=lb[0];
  var rows=lb.slice(0,5).map(function(r){ return '<li><span>'+esc(r.name)+'</span><span class="p">'+r.p+(r.p===1?" pt":" pts")+'</span></li>'; }).join("");
  slot.innerHTML='<div class="champ"><div class="lab">House champion</div><div class="name">'+esc(top.name)+'</div>'+
    '<div class="pts">'+top.p+(top.p===1?" point":" points")+' \u00b7 first slice of the tart</div><ul class="board-list">'+rows+'</ul></div>';
}
function renderLeaderboard(){
  var slot=document.getElementById("leaderboard-slot");
  if(!me){ slot.innerHTML=""; return; }
  var lb=leaderboard();
  if(!lb.length){ slot.innerHTML='<div class="lb"><p class="lb-head">Leaderboard</p><p class="empty">no scores yet</p></div>'; return; }
  var rows=lb.map(function(r,i){
    return '<div class="lb-row'+(r.name===me?' me-row':'')+'">'+
      '<span class="lb-rank">'+(i+1)+'.</span>'+
      '<span class="lb-name">'+esc(r.name)+'</span>'+
      '<span class="lb-pts">'+(r.p>0?'+':'')+r.p+' pt'+(Math.abs(r.p)===1?'':'s')+'</span>'+
    '</div>';
  }).join("");
  slot.innerHTML='<div class="lb"><p class="lb-head">Leaderboard</p>'+rows+'</div>';
}
var hostUnlocked=false;
function renderHost(){
  var slot=document.getElementById("host-slot");
  if(!hostUnlocked){
    slot.innerHTML='<div class="host-panel"><h3>Host controls</h3><p class="hint">Set the real answers and reveal everything at dessert.</p>'+
      '<div class="field"><input id="pin" type="text" placeholder="host code" autocomplete="off" /><button class="btn sm" id="pin-go">Unlock</button></div></div>';
    var pin=document.getElementById("pin"), pg=document.getElementById("pin-go");
    function tryPin(){ if(pin.value.trim()===HOST_PIN){ hostUnlocked=true; renderHost(); } else { pin.value=""; pin.placeholder="nope — try again"; } }
    pg.onclick=tryPin; pin.addEventListener("keydown",function(e){ if(e.key==="Enter") tryPin(); }); return;
  }
  var needAns=QS.filter(function(q){return q.src==="host";});
  var rows=needAns.map(function(q){ var cur=state.answers[q.id]!=null?esc(state.answers[q.id]):"";
    return '<div class="host-row"><label><b>'+q.n+'.</b> '+esc(q.q)+'</label><input type="text" data-ans="'+q.id+'" value="'+cur+'" placeholder="'+(q.judged?"the answer (you award the winner)":"correct answer")+'" /></div>'; }).join("");
  slot.innerHTML='<div class="host-panel"><h3>Set the answers</h3><p class="hint">Type the truth for each. Estimates auto-pick the closest guess. Saved to every phone.</p>'+rows+
    '<div class="host-actions"><button class="btn sm" id="save-ans">Save answers</button>'+
    '<button class="btn sm '+(state.revealed?"ghost":"reveal-on")+'" id="reveal">'+(state.revealed?"Hide answers":"Reveal at dessert")+'</button>'+
    '<button class="btn sm danger" id="wipe">Clear all guesses</button></div></div>';
  document.getElementById("save-ans").onclick=function(){
    var obj={}; slot.querySelectorAll("[data-ans]").forEach(function(inp){ var v=inp.value.trim(); if(v) obj[inp.getAttribute("data-ans")]=v; });
    if(db) db.ref("state/answers").set(obj); flash("save-ans","Saved");
  };
  document.getElementById("reveal").onclick=function(){ if(db) db.ref("state/revealed").set(!state.revealed); };
  document.getElementById("wipe").onclick=function(){ if(confirm("Clear every guess on every phone? This can't be undone.")&&db) db.ref("board").remove(); };
}
function flash(id,txt){ var b=document.getElementById(id); if(!b)return; var o=b.textContent; b.textContent=txt; setTimeout(function(){ if(document.getElementById(id)) b.textContent=o; },1200); }

initFirebase();
render();
</script>
